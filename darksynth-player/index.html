<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darksynth Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player">
        <div class="logo">
            <img src="img/logo.png" alt="Darksynth Logo">
        </div>
        <h1>DARKSYNTH PLAYER</h1>
        <div class="song-details">
            <div id="song-title" class="song-title">Song Title</div>
            <div id="song-artist" class="song-artist">Artist Name</div>
        </div>
        <div class="controls">
            <button id="prev-btn">Prev</button>
            <button id="play-pause-btn">Play</button>
            <button id="next-btn">Next</button>
        </div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <div class="volume-container">
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
        <audio id="audio" src="audio/placeholder.mp3"></audio>
        <canvas id="visualizer"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
