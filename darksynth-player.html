<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darksynth Player</title>
    <style>
        body {
    background-color: #1a1a1a;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.player {
    background-color: #0d0d0d;
    border: 2px solid #00ffff;
    border-radius: 10px;
    padding: 20px;
    width: 350px;
    box-shadow: 0 0 20px #00ffff;
}

.logo img {
    width: 100%;
    max-width: 200px;
    display: block;
    margin: 0 auto 20px;
}

.song-details {
    text-align: center;
    margin-bottom: 20px;
}

.song-title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 5px;
}

.song-artist {
    font-size: 18px;
    color: #00ffff;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
}

.controls button {
    background-color: transparent;
    border: 2px solid #00ffff;
    color: #00ffff;
    padding: 10px 20px;
    margin: 0 10px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.controls button:hover {
    background-color: #00ffff;
    color: #0d0d0d;
}

.file-input-container {
    text-align: center;
    margin-bottom: 20px;
}

#upload-btn {
    background-color: transparent;
    border: 2px solid #00ffff;
    color: #00ffff;
    padding: 10px 20px;
    cursor: pointer;
    transition: all 0.3s ease;
}

#upload-btn:hover {
    background-color: #00ffff;
    color: #0d0d0d;
}

.youtube-input-container {
    text-align: center;
    margin-bottom: 20px;
}

#youtube-url {
    background-color: #333;
    border: 2px solid #00ffff;
    color: #fff;
    padding: 10px;
    width: 70%;
    border-radius: 5px;
}

#youtube-load-btn {
    background-color: transparent;
    border: 2px solid #00ffff;
    color: #00ffff;
    padding: 10px 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 5px;
    margin-left: 10px;
}

#youtube-load-btn:hover {
    background-color: #00ffff;
    color: #0d0d0d;
}

.progress-container {
    background-color: #333;
    border-radius: 5px;
    cursor: pointer;
    margin: 10px 0;
    height: 10px;
    width: 100%;
}

.progress-bar {
    background-color: #00ffff;
    border-radius: 5px;
    height: 100%;
    width: 0%;
}

.volume-container {
    display: flex;
    justify-content: center;
    align-items: center;
}

#volume-slider {
    -webkit-appearance: none;
    width: 100%;
    height: 8px;
    background: #333;
    outline: none;
    opacity: 0.7;
    -webkit-transition: .2s;
    transition: opacity .2s;
    border-radius: 5px;
}

#volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    background: #00ffff;
    cursor: pointer;
    border-radius: 50%;
}

#visualizer {
    width: 100%;
    height: 100px;
    display: block;
    margin-top: 20px;
}
    </style>
</head>

        <h1>DARKSYNTH PLAYER</h1>
        <div class="song-details">
            <div id="song-title" class="song-title">Song Title</div>
            <div id="song-artist" class="song-artist">Artist Name</div>
        </div>
        <div class="controls">

        </div>

            <input type="file" id="file-input" accept="audio/*" style="display: none;">

            <input type="text" id="youtube-url" placeholder="Enter YouTube URL">
            <button id="youtube-load-btn">Load</button>

            <div class="progress-bar"></div>
        </div>

            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>

    <script>
        const playBtn = document.getElementById('play-pause-btn');
const audio = document.getElementById('audio');
const songTitle = document.getElementById('song-title');
const songArtist = document.getElementById('song-artist');
const progressContainer = document.querySelector('.progress-container');
const progressBar = document.querySelector('.progress-bar');
const volumeSlider = document.getElementById('volume-slider');
const canvas = document.getElementById('visualizer');
const canvasCtx = canvas.getContext('2d');
const fileInput = document.getElementById('file-input');
const uploadBtn = document.getElementById('upload-btn');
const youtubeUrlInput = document.getElementById('youtube-url');
const youtubeLoadBtn = document.getElementById('youtube-load-btn');

let isPlaying = false;
let youtubePlayer;
let youtubePlayerReady = false;

// Audio Visualization
let audioCtx, analyser, source, bufferLength, dataArray;

function initAudioApi() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 256;
        bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
    }
}

function drawVisualizer() {
    requestAnimationFrame(drawVisualizer);
    if (analyser) {
        analyser.getByteFrequencyData(dataArray);

        canvasCtx.fillStyle = '#0d0d0d';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2.5;
        let barHeight;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
            barHeight = dataArray[i];
            canvasCtx.fillStyle = 'rgb(0, ' + (barHeight + 100) + ', ' + (barHeight + 100) + ')';
            canvasCtx.fillRect(x, canvas.height - barHeight / 2, barWidth, barHeight / 2);
            x += barWidth + 1;
        }
    }
}


function playSong() {
    if (audio.src) {
        isPlaying = true;
        playBtn.textContent = 'Pause';
        audio.play();
        if(!audioCtx) {
            initAudioApi();
            drawVisualizer();
        }
        audioCtx.resume();
    }
}

function pauseSong() {
    isPlaying = false;
    playBtn.textContent = 'Play';
    audio.pause();
}

function togglePlay() {
    if (youtubePlayer && youtubePlayer.getPlayerState) {
        if (youtubePlayer.getPlayerState() === YT.PlayerState.PLAYING) {
            youtubePlayer.pauseVideo();
        } else {
            youtubePlayer.playVideo();
        }
    } else if (audio.src) {
        if (isPlaying) {
            pauseSong();
        } else {
            playSong();
        }
    }
}

function updateProgress(e) {
    const { duration, currentTime } = e.srcElement;
    if (duration) {
        const progressPercent = (currentTime / duration) * 100;
        progressBar.style.width = `${progressPercent}%`;
    }
}

function setProgress(e) {
    const width = this.clientWidth;
    const clickX = e.offsetX;
    if (youtubePlayer && youtubePlayer.getPlayerState && youtubePlayer.getPlayerState() === YT.PlayerState.PLAYING) {
        const duration = youtubePlayer.getDuration();
        if (duration) {
            const newTime = (clickX / width) * duration;
            youtubePlayer.seekTo(newTime);
        }
    }
    else if (audio.src) {
        const duration = audio.duration;
        if (duration) {
            audio.currentTime = (clickX / width) * duration;
        }
    }
}

function setVolume() {
    audio.volume = volumeSlider.value;
    if (youtubePlayer && youtubePlayer.setVolume) {
        youtubePlayer.setVolume(volumeSlider.value * 100);
    }
}

function loadFile(event) {
    const file = event.target.files[0];
    if (file) {
        if (youtubePlayer && youtubePlayer.stopVideo) {
            youtubePlayer.stopVideo();
        }
        canvas.style.display = 'block';
        const url = URL.createObjectURL(file);
        audio.src = url;
        songTitle.textContent = file.name;
        songArtist.textContent = 'Local File';
        playSong();
    }
}

uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', loadFile);
playBtn.addEventListener('click', togglePlay);
audio.addEventListener('timeupdate', updateProgress);
progressContainer.addEventListener('click', setProgress);
volumeSlider.addEventListener('input', setVolume);
youtubeLoadBtn.addEventListener('click', loadYoutubeVideo);


function onYouTubeIframeAPIReady() {
    youtubePlayerReady = true;
}

function loadYoutubeVideo() {
    if (audio.isPlaying) {
        pauseSong();
    }
    audio.src = "";
    canvas.style.display = 'none';
    const url = youtubeUrlInput.value;
    const videoId = getYoutubeVideoId(url);
    if (videoId) {
        if (youtubePlayer) {
            youtubePlayer.loadVideoById(videoId);
        } else {
            youtubePlayer = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                videoId: videoId,
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }
    }
}

function getYoutubeVideoId(url) {
    const regex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
    const matches = url.match(regex);
    return matches ? matches[1] : null;
}

function onPlayerReady(event) {
    event.target.playVideo();
    songTitle.textContent = event.target.getVideoData().title;
    songArtist.textContent = 'YouTube';
}

function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playBtn.textContent = 'Pause';
    } else {
        isPlaying = false;
        playBtn.textContent = 'Play';
    }
}

setInterval(() => {
    if (youtubePlayer && youtubePlayer.getPlayerState && youtubePlayer.getPlayerState() === YT.PlayerState.PLAYING) {
        const duration = youtubePlayer.getDuration();
        const currentTime = youtubePlayer.getCurrentTime();
        if (duration) {
            const progressPercent = (currentTime / duration) * 100;
            progressBar.style.width = `${progressPercent}%`;
        }
    }
}, 500);


setVolume();
drawVisualizer();

    </script>
</body>
</html>
